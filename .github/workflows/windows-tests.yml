name: Windows tests

on:
  pull_request:
  push:
    branches:
      - main
      - codex/auto-generate-reliability-upgrade

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      AUTO_GENERATE_OFFLINE_TESTS: "1"
      AUTO_GENERATE_FAIL_ON_UNEXPECTED_SKIP: "1"
      AUTO_GENERATE_RUN_LIVE_API: "0"
      AUTO_GENERATE_RUN_PLAYWRIGHT: "0"
      AUTO_GENERATE_RUN_HEAVY_OCR: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements-dev.txt
      - name: Strict-offline test suite
        run: >-
          python -m pytest -q --strict-markers
          -m "not live_api and not playwright and not heavy_ocr"
      - name: Type check
        run: python -m pyright

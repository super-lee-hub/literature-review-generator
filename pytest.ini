[pytest]
testpaths = tests
markers =
    unit: fast isolated tests
    integration: tests spanning multiple project modules
    slow: tests that are intentionally slower than the default unit suite
    live_api: tests that require an explicitly enabled external API and credential
    playwright: browser-based GUI tests requiring Playwright and installed browsers
    heavy_ocr: tests that invoke heavyweight OCR or document conversion tools
    optional: tests allowed to skip when their declared external capability is unavailable

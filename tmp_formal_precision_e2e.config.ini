primary_rpm_limit = 500
backup_tpm_limit = 0
backup_rpm_limit = 0
enable_stage1_validation = false
enable_stage2_validation = true
keep_checkpoints_after_completion = true

[Preprocess]
strategy_policy = formal_precision
enabled = true
cache_dir = ./output/_preprocess_cache
parser_mode = remote
primary_parser = mineru_remote
fallback_parser = none
extractor_profile = auto
ocr_mode = auto
ocr_languages = eng
force_rebuild = true
use_markdown_as_stage1_input = true
retain_structured_output = true
retain_page_index = true
retain_diagnostics = true
enable_local_rag = false
rag_backend = chroma

[Retry_Settings]
